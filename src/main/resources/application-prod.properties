# ===================================================================
# Clyvo Vet Web - Perfil de PRODUÇÃO
# ===================================================================
# Ativado com SPRING_PROFILES_ACTIVE=prod. Sobrescreve os valores de
# application.properties nos pontos sensíveis: nada de console de banco
# exposto, nada de exceção de CSRF liberada, nada de credenciais de
# teste na tela de login, banco real via variáveis de ambiente.
# ===================================================================

# ---- Banco de dados real (Oracle, PostgreSQL, MySQL...) ----
# Defina as quatro variáveis abaixo no ambiente de produção. Nenhum
# valor de banco fica hardcoded neste arquivo.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=${DB_DRIVER:oracle.jdbc.OracleDriver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.OracleDialect}

# ---- Console H2: desligado (a autoconfiguração nem chega a expor /h2-console) ----
spring.h2.console.enabled=false
app.h2-console.permitir=false

# ---- Sem barulho de SQL/telas de teste em produção ----
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.thymeleaf.cache=true
app.mostrar-credenciais-teste=false

# ---- Logs mais enxutos ----
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=WARN
logging.level.org.hibernate=WARN

# ---- URL pública usada nos links de e-mail (recuperação de senha) ----
app.url-base=${APP_URL_BASE}
