# ===================================================================
# Clyvo Vet Web - Perfil de PRODUÇÃO
# ===================================================================
# Ativado com SPRING_PROFILES_ACTIVE=prod. Sobrescreve os valores de
# application.properties nos pontos sensíveis: nada de console de banco
# exposto, nada de exceção de CSRF liberada, nada de credenciais de
# teste na tela de login, banco real via variáveis de ambiente.
# ===================================================================

# ---- Banco de dados real (Oracle, PostgreSQL, MySQL...) ----
# Defina as quatro variáveis abaixo no ambiente de produção. Nenhum
# valor de banco fica hardcoded neste arquivo.
# Aceita as duas formas: DB_URL com a URL JDBC completa, ou as partes
# separadas (DB_HOST/DB_PORT/DB_NAME), que e o que provedores como o
# Render expoem. A URL que eles entregam vem no formato postgres://,
# que o driver JDBC nao aceita, por isso ela e montada aqui.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clyvodb}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=${DB_DRIVER:org.postgresql.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# ---- Console H2: desligado (a autoconfiguração nem chega a expor /h2-console) ----
spring.h2.console.enabled=false
app.h2-console.permitir=false

# ---- Sem barulho de SQL/telas de teste em produção ----
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.thymeleaf.cache=true
app.mostrar-credenciais-teste=false

# ---- Logs mais enxutos ----
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=WARN
logging.level.org.hibernate=WARN

# ---- Proxy reverso & Sessão HTTP Cloud ----
server.forward-headers-strategy=framework
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.secure=true

# ---- URL pública usada nos links de e-mail (recuperação de senha) ----
app.url-base=${APP_URL_BASE:}
