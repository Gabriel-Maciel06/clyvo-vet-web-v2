<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acesso Negado - Clyvo Vet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/clyvo.css}">
</head>
<body class="auth-body">
    <div class="auth-sheet text-center" style="max-width: 500px;">
        <i class="bi bi-shield-lock-fill text-danger fs-1 mb-3 d-block"></i>
        <h2 class="auth-title">Acesso Restrito</h2>
        <p class="text-muted mx-auto">Seu perfil de usuário não possui autorização (Role) suficiente para acessar este recurso clínico ou administrativo.</p>
        <a th:href="@{/dashboard}" class="btn btn-clyvo mt-3" style="width: auto;">
            <i class="bi bi-arrow-left me-1"></i> Voltar ao Dashboard
        </a>
    </div>
</body>
</html>
