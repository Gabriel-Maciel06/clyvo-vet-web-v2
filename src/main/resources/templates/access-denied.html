<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acesso Negado - Clyvo Vet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100" style="font-family: 'Plus Jakarta Sans', sans-serif;">
    <div class="container text-center">
        <div class="card p-5 mx-auto border-0 shadow-sm" style="max-width: 500px; border-radius: 1.5rem;">
            <i class="bi bi-shield-lock-fill text-danger display-1 mb-3"></i>
            <h2 class="fw-bold text-dark">Acesso Restrito</h2>
            <p class="text-muted">Seu perfil de usuário não possui autorização (Role) suficiente para acessar este recurso clínico ou administrativo.</p>
            <a th:href="@{/dashboard}" class="btn btn-dark rounded-pill px-4 mt-3">
                <i class="bi bi-arrow-left me-1"></i> Voltar ao Dashboard
            </a>
        </div>
    </div>
</body>
</html>
