<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha — Clyvo Vet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/caderneta.css}" rel="stylesheet">
    <style>.spread { max-width: 680px; }</style>
</head>
<body class="auth-body">

    <div class="spread">
        <div class="spread-cover">
            <div>
                <div class="cover-mark">Clyvo<span>Vet</span></div>
                <div class="cover-line">Chave perdida, ficha intacta</div>
            </div>
            <div class="cover-stamp"><i class="bi bi-key"></i></div>
        </div>

        <div class="spread-page">
            <h1 class="page-title">Recuperar senha</h1>
            <p class="text-muted mb-4" style="font-size: 0.9rem;">Informe o e-mail da conta para receber o link de redefinição.</p>

            <div th:if="${successMessage}" class="selo selo-sage mb-3"><i class="bi bi-check-circle"></i> <span th:text="${successMessage}"></span></div>

            <form th:if="${successMessage == null}" th:action="@{/recuperar-senha}" th:object="${recuperarSenhaDto}" method="post">
                <div class="mb-4">
                    <label class="form-label fw-semibold small">E-mail cadastrado</label>
                    <input type="email" class="form-control" th:field="*{email}" required autofocus>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <button type="submit" class="btn btn-clyvo w-100">Enviar link de redefinição</button>
            </form>

            <p class="text-center small text-muted mt-4 mb-0">
                <a th:href="@{/login}" class="fw-semibold text-decoration-none" style="color: var(--forest);"><i class="bi bi-arrow-left"></i> Voltar ao login</a>
            </p>
        </div>
    </div>

</body>
</html>
