<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Clyvo Vet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/clyvo.css}">
</head>
<body class="auth-body">
    <div class="auth-sheet">
        <div class="auth-brand">
            <div class="auth-brand-mark"><i class="bi bi-key-fill"></i></div>
            <div>
                <h3 class="auth-title">Recuperar Senha</h3>
                <p class="text-muted small mb-0">Informe o e-mail da sua conta para receber o link de redefinição</p>
            </div>
        </div>

        <div th:if="${successMessage}" class="alert alert-success small" role="alert">
            <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${successMessage}"></span>
        </div>

        <form th:if="${successMessage == null}" th:action="@{/recuperar-senha}" th:object="${recuperarSenhaDto}" method="post">
            <div class="mb-4">
                <label class="form-label">E-mail cadastrado</label>
                <input type="email" class="form-control" th:field="*{email}" placeholder="voce@email.com" required autofocus>
                <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <button type="submit" class="btn btn-clyvo mb-3">
                <i class="bi bi-send-fill me-1"></i> Enviar link de redefinição
            </button>
        </form>

        <div class="text-center small mt-2">
            <a th:href="@{/login}" class="auth-link">
                <i class="bi bi-arrow-left me-1"></i>Voltar ao login
            </a>
        </div>
    </div>
</body>
</html>
