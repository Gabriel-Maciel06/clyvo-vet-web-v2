<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Clyvo Vet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f766e 0%, #0f172a 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
        }
        .auth-card {
            background: white; border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3), 0 8px 10px -6px rgb(0 0 0 / 0.3);
            width: 100%; max-width: 440px; padding: 2.5rem;
        }
        .brand-logo { font-size: 2.5rem; color: #0d9488; }
        .btn-clyvo {
            background-color: #0d9488; color: white; font-weight: 700;
            padding: 0.75rem; border-radius: 0.75rem; border: none; width: 100%;
        }
        .btn-clyvo:hover { background-color: #0f766e; color: white; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="brand-logo mb-2"><i class="bi bi-key-fill"></i></div>
            <h3 class="fw-bold mb-1">Recuperar Senha</h3>
            <p class="text-muted small">Informe o e-mail da sua conta para receber o link de redefinição</p>
        </div>

        <div th:if="${successMessage}" class="alert alert-success small" role="alert">
            <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${successMessage}"></span>
        </div>

        <form th:if="${successMessage == null}" th:action="@{/recuperar-senha}" th:object="${recuperarSenhaDto}" method="post">
            <div class="mb-4">
                <label class="form-label fw-semibold small text-secondary">E-mail cadastrado</label>
                <input type="email" class="form-control" th:field="*{email}" placeholder="voce@email.com" required autofocus>
                <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <button type="submit" class="btn btn-clyvo mb-3">
                <i class="bi bi-send-fill me-1"></i> Enviar link de redefinição
            </button>
        </form>

        <div class="text-center small mt-2">
            <a th:href="@{/login}" class="text-decoration-none fw-semibold" style="color: #0d9488;">
                <i class="bi bi-arrow-left me-1"></i>Voltar ao login
            </a>
        </div>
    </div>
</body>
</html>
