<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Caderneta Clyvo Vet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/caderneta.css}" rel="stylesheet">
</head>
<body class="auth-body">

    <div class="spread">
        <div class="spread-cover">
            <div>
                <div class="cover-mark">Clyvo<span>Vet</span></div>
                <div class="cover-line">Caderneta de medicina preventiva pet</div>
            </div>
            <div class="cover-stamp"><i class="bi bi-heart-pulse"></i></div>
        </div>

        <div class="spread-page">
            <h1 class="page-title">Entrar</h1>
            <p class="text-muted mb-4" style="font-size: 0.9rem;">Acesse a caderneta do seu pet.</p>

            <div th:if="${errorMessage}" class="selo selo-rust mb-3"><i class="bi bi-exclamation-circle"></i> <span th:text="${errorMessage}"></span></div>
            <div th:if="${logoutMessage}" class="selo selo-sage mb-3"><i class="bi bi-info-circle"></i> <span th:text="${logoutMessage}"></span></div>
            <div th:if="${successMessage}" class="selo selo-sage mb-3"><i class="bi bi-check-circle"></i> <span th:text="${successMessage}"></span></div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold small">Usuário</label>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                </div>
                <div class="mb-2">
                    <label for="password" class="form-label fw-semibold small">Senha</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="text-end mb-3">
                    <a th:href="@{/recuperar-senha}" class="text-decoration-none small" style="color: var(--pine-ink);">Esqueci minha senha</a>
                </div>
                <button type="submit" class="btn btn-clyvo w-100">Entrar na caderneta</button>
            </form>

            <div th:if="${googleLoginEnabled}">
                <div class="divisor">ou</div>
                <a th:href="@{/oauth2/authorization/google}" class="btn-google">
                    <svg width="17" height="17" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
                        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.9 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
                        <path fill="#4CAF50" d="M24 44c5.5 0 10.5-2.1 14.3-5.5l-6.6-5.6C29.6 34.6 27 35.5 24 35.5c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
                        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.6 5.6C41.6 35.7 44 30.3 44 24c0-1.3-.1-2.7-.4-3.5z"/>
                    </svg>
                    Continuar com Google
                </a>
            </div>

            <p class="text-center small text-muted mt-4 mb-0">
                Ainda não tem conta? <a th:href="@{/cadastro}" class="fw-semibold text-decoration-none" style="color: var(--forest);">Abrir caderneta</a>
            </p>

            <div th:if="${mostrarCredenciaisTeste}" class="mt-4 pt-3" style="border-top: 1px dashed var(--paper-line); font-size: 0.78rem; color: var(--ink-soft);">
                <div class="fw-semibold mb-1"><i class="bi bi-key"></i> Acesso de teste</div>
                <div>Vet: <code>admin</code> / <code>admin123</code></div>
                <div>Tutor: <code>tutor</code> / <code>tutor123</code></div>
            </div>
        </div>
    </div>

</body>
</html>
