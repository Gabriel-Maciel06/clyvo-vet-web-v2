<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Clyvo Vet Longevidade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f766e 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3), 0 8px 10px -6px rgb(0 0 0 / 0.3);
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
        }
        .brand-logo {
            font-size: 2.5rem;
            color: #0d9488;
        }
        .btn-clyvo {
            background-color: #0d9488;
            color: white;
            font-weight: 700;
            padding: 0.75rem;
            border-radius: 0.75rem;
            border: none;
            width: 100%;
            transition: all 0.2s;
        }
        .btn-clyvo:hover {
            background-color: #0f766e;
            color: white;
            transform: translateY(-1px);
        }
        .cred-box {
            background-color: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <div class="brand-logo mb-2">
                <i class="bi bi-heart-pulse-fill"></i>
            </div>
            <h3 class="fw-bold mb-1">Clyvo<span class="text-teal" style="color: #0d9488;">Vet</span></h3>
            <p class="text-muted small">Medicina Preventiva & Longevidade Pet</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show small" role="alert">
            <i class="bi bi-exclamation-circle-fill me-1"></i>
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${logoutMessage}" class="alert alert-info alert-dismissible fade show small" role="alert">
            <i class="bi bi-info-circle-fill me-1"></i>
            <span th:text="${logoutMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold small text-secondary">Usuário</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="Digite seu login" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold small text-secondary">Senha</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Digite sua senha" required>
                </div>
            </div>

            <button type="submit" class="btn btn-clyvo mb-4">
                <i class="bi bi-box-arrow-in-right me-1"></i> Acessar Plataforma
            </button>
        </form>

        <div class="cred-box">
            <div class="fw-bold text-dark mb-1"><i class="bi bi-key-fill text-warning me-1"></i> Credenciais de Teste (FIAP):</div>
            <div class="d-flex justify-content-between mb-1">
                <span><strong>Admin/Vet:</strong> <code>admin</code> / <code>admin123</code></span>
            </div>
            <div class="d-flex justify-content-between">
                <span><strong>Tutor Pet:</strong> <code>tutor</code> / <code>tutor123</code></span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
