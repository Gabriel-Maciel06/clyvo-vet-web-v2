<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - Clyvo Vet'">Erro - Clyvo Vet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/clyvo.css}">
</head>
<body class="auth-body">
    <div class="auth-sheet text-center" style="max-width: 520px;">
        <i class="bi bi-exclamation-triangle-fill text-warning fs-1 mb-2 d-block"></i>
        <span class="badge bg-secondary mx-auto mb-3" th:text="'HTTP ' + ${status}">HTTP 404</span>
        <h3 class="auth-title" th:text="${titulo}">Registro não encontrado</h3>
        <p class="text-muted mx-auto" th:text="${mensagem}">O recurso solicitado não existe.</p>
        <a th:href="@{/dashboard}" class="btn btn-clyvo mt-3" style="width: auto;">
            <i class="bi bi-arrow-left me-1"></i> Voltar ao Dashboard
        </a>
    </div>
</body>
</html>
