<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' — Clyvo Vet'">Erro — Clyvo Vet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/caderneta.css}" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="card p-5 text-center" style="max-width: 460px;">
        <span class="selo selo-rust mb-3" style="width: fit-content; margin-inline: auto;" th:text="'HTTP ' + ${status}">HTTP 404</span>
        <h1 class="serif-display" style="font-size: 1.4rem;" th:text="${titulo}">Registro não encontrado</h1>
        <p class="text-muted" th:text="${mensagem}">O recurso solicitado não existe.</p>
        <div><a th:href="@{/dashboard}" class="btn btn-clyvo mt-2">Voltar ao painel</a></div>
    </div>
</body>
</html>
