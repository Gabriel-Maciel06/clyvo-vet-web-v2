<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - Clyvo Vet'">Erro - Clyvo Vet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: linear-gradient(135deg, #0f766e 0%, #0f172a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; }
        .card-erro { max-width: 520px; border-radius: 1.5rem; }
    </style>
</head>
<body>
    <div class="card card-erro p-5 text-center shadow-lg border-0">
        <div class="display-3 text-warning mb-2"><i class="bi bi-exclamation-triangle-fill"></i></div>
        <span class="badge bg-secondary rounded-pill mx-auto mb-3" th:text="'HTTP ' + ${status}">HTTP 404</span>
        <h3 class="fw-bold text-dark" th:text="${titulo}">Registro não encontrado</h3>
        <p class="text-muted" th:text="${mensagem}">O recurso solicitado não existe.</p>
        <a th:href="@{/dashboard}" class="btn btn-success rounded-pill px-4 mt-3">
            <i class="bi bi-arrow-left me-1"></i> Voltar ao Dashboard
        </a>
    </div>
</body>
</html>
