<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Clyvo Vet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f766e 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .auth-card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3), 0 8px 10px -6px rgb(0 0 0 / 0.3);
            width: 100%;
            max-width: 560px;
            padding: 2.5rem;
        }
        .brand-logo { font-size: 2.5rem; color: #0d9488; }
        .btn-clyvo {
            background-color: #0d9488; color: white; font-weight: 700;
            padding: 0.75rem; border-radius: 0.75rem; border: none; width: 100%;
        }
        .btn-clyvo:hover { background-color: #0f766e; color: white; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="brand-logo mb-2"><i class="bi bi-heart-pulse-fill"></i></div>
            <h3 class="fw-bold mb-1">Criar Conta na Clyvo<span style="color: #0d9488;">Vet</span></h3>
            <p class="text-muted small">Cadastro de tutor - monitore a saúde e longevidade dos seus pets</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger small" role="alert">
            <i class="bi bi-exclamation-circle-fill me-1"></i> <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/cadastro}" th:object="${cadastroDto}" method="post">
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label fw-semibold small text-secondary">Nome completo *</label>
                    <input type="text" class="form-control" th:field="*{nomeCompleto}" placeholder="Seu nome completo" required autofocus>
                    <div class="text-danger small" th:if="${#fields.hasErrors('nomeCompleto')}" th:errors="*{nomeCompleto}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold small text-secondary">CPF *</label>
                    <input type="text" class="form-control" th:field="*{cpf}" placeholder="000.000.000-00" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold small text-secondary">E-mail *</label>
                    <input type="email" class="form-control" th:field="*{email}" placeholder="voce@email.com" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold small text-secondary">Telefone *</label>
                    <input type="text" class="form-control" th:field="*{telefone}" placeholder="(11) 98765-4321" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-semibold small text-secondary">Nome de usuário *</label>
                    <input type="text" class="form-control" th:field="*{username}" placeholder="Como você vai entrar no sistema" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold small text-secondary">Senha *</label>
                    <input type="password" class="form-control" th:field="*{senha}" placeholder="Mínimo 6 caracteres" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold small text-secondary">Confirmar senha *</label>
                    <input type="password" class="form-control" th:field="*{confirmarSenha}" placeholder="Repita a senha" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('confirmarSenha')}" th:errors="*{confirmarSenha}"></div>
                </div>
            </div>

            <button type="submit" class="btn btn-clyvo mt-4">
                <i class="bi bi-person-plus-fill me-1"></i> Criar minha conta
            </button>
        </form>

        <div class="text-center small mt-4">
            <span class="text-muted">Já tem conta?</span>
            <a th:href="@{/login}" class="text-decoration-none fw-semibold" style="color: #0d9488;">Entrar</a>
        </div>
    </div>

</body>
</html>
