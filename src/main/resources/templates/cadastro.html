<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir caderneta — Clyvo Vet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/caderneta.css}" rel="stylesheet">
    <style>.spread { max-width: 760px; }</style>
</head>
<body class="auth-body">

    <div class="spread">
        <div class="spread-cover">
            <div>
                <div class="cover-mark">Clyvo<span>Vet</span></div>
                <div class="cover-line">Toda caderneta começa com uma ficha</div>
            </div>
            <div class="cover-stamp"><i class="bi bi-journal-plus"></i></div>
        </div>

        <div class="spread-page">
            <h1 class="page-title">Abrir caderneta</h1>
            <p class="text-muted mb-3" style="font-size: 0.9rem;">Cadastro de tutor — os campos com * são obrigatórios.</p>

            <div th:if="${errorMessage}" class="selo selo-rust mb-3"><i class="bi bi-exclamation-circle"></i> <span th:text="${errorMessage}"></span></div>

            <form th:action="@{/cadastro}" th:object="${cadastroDto}" method="post">
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label fw-semibold small">Nome completo *</label>
                        <input type="text" class="form-control" th:field="*{nomeCompleto}" required autofocus>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nomeCompleto')}" th:errors="*{nomeCompleto}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold small">CPF *</label>
                        <input type="text" class="form-control" th:field="*{cpf}" placeholder="000.000.000-00" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold small">E-mail *</label>
                        <input type="email" class="form-control" th:field="*{email}" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold small">Telefone *</label>
                        <input type="text" class="form-control" th:field="*{telefone}" placeholder="(11) 98765-4321" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label fw-semibold small">Nome de usuário *</label>
                        <input type="text" class="form-control" th:field="*{username}" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold small">Senha *</label>
                        <input type="password" class="form-control" th:field="*{senha}" placeholder="Mínimo 6 caracteres" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold small">Confirmar senha *</label>
                        <input type="password" class="form-control" th:field="*{confirmarSenha}" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmarSenha')}" th:errors="*{confirmarSenha}"></div>
                    </div>
                </div>

                <button type="submit" class="btn btn-clyvo w-100 mt-4">Criar minha caderneta</button>
            </form>

            <p class="text-center small text-muted mt-3 mb-0">
                Já tem conta? <a th:href="@{/login}" class="fw-semibold text-decoration-none" style="color: var(--forest);">Entrar</a>
            </p>
        </div>
    </div>

</body>
</html>
