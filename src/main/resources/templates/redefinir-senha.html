<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha — Clyvo Vet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/caderneta.css}" rel="stylesheet">
    <style>.spread { max-width: 680px; }</style>
</head>
<body class="auth-body">

    <div class="spread">
        <div class="spread-cover">
            <div>
                <div class="cover-mark">Clyvo<span>Vet</span></div>
                <div class="cover-line">Nova senha, mesma ficha</div>
            </div>
            <div class="cover-stamp"><i class="bi bi-shield-lock"></i></div>
        </div>

        <div class="spread-page">
            <h1 class="page-title">Redefinir senha</h1>

            <div th:if="${tokenInvalido}">
                <div class="selo selo-rust mb-3"><i class="bi bi-exclamation-triangle"></i> Este link é inválido, já foi usado ou expirou.</div>
                <a th:href="@{/recuperar-senha}" class="btn btn-clyvo w-100">Solicitar novo link</a>
            </div>

            <form th:if="${!tokenInvalido}" th:action="@{/redefinir-senha}" th:object="${redefinirSenhaDto}" method="post">
                <input type="hidden" th:field="*{token}">
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Nova senha</label>
                    <input type="password" class="form-control" th:field="*{novaSenha}" placeholder="Mínimo 6 caracteres" required autofocus>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('novaSenha')}" th:errors="*{novaSenha}"></div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold small">Confirmar nova senha</label>
                    <input type="password" class="form-control" th:field="*{confirmarSenha}" required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmarSenha')}" th:errors="*{confirmarSenha}"></div>
                </div>
                <button type="submit" class="btn btn-clyvo w-100">Redefinir senha</button>
            </form>
        </div>
    </div>

</body>
</html>
