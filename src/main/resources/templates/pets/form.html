<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${petDto != null && petDto.id != null ? 'Editar Pet' : 'Cadastrar Pet'})}"></head>
<body>

    <div th:replace="~{fragments/layout :: appShell('pets', ~{::#mainSection})}">
        <div id="mainSection">

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card p-4 p-md-5">
                        <div class="mb-4">
                            <h3 class="mb-1">
                                <i class="bi bi-pencil-square me-2" style="color: #0d9488;" th:if="${petDto != null && petDto.id != null}"></i>
                                <i class="bi bi-heart-pulse me-2" style="color: #0d9488;" th:if="${petDto == null || petDto.id == null}"></i>
                                <span th:text="${petDto != null && petDto.id != null ? 'Editar Informações do Pet' : 'Cadastrar Novo Pet'}">Cadastrar Novo Pet</span>
                            </h3>
                            <p class="text-muted mb-0" th:text="${petDto != null && petDto.id != null ? 'Atualize as informações do animal para manter o prontuário e o cálculo de longevidade em dia.' : 'Insira as informações do animal para acompanhamento preventivo e cálculo de longevidade.'}">
                                Insira as informações do animal para acompanhamento preventivo e cálculo de longevidade.
                            </p>
                        </div>

                        <form th:action="@{/pets/salvar}" th:object="${petDto}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="row g-3">
                                <div class="col-md-8">
                                    <label for="nome" class="form-label">Nome do Pet *</label>
                                    <input type="text" class="form-control" id="nome" th:field="*{nome}" placeholder="Ex: Thor, Luna, Bob" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                                </div>

                                <div class="col-md-4">
                                    <label for="peso" class="form-label">Peso Atual (kg) *</label>
                                    <input type="number" step="0.1" class="form-control" id="peso" th:field="*{peso}" placeholder="Ex: 12.5" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('peso')}" th:errors="*{peso}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label for="racaId" class="form-label">Espécie & Raça *</label>
                                    <select class="form-select" id="racaId" th:field="*{racaId}" data-placeholder="Selecione ou digite para buscar espécie/raça...">
                                        <option value=""></option>
                                        <th:block th:if="${racasPorEspecie != null}">
                                            <optgroup th:each="entry : ${racasPorEspecie}" th:label="${entry.value[0].emoji} + ' ' + ${entry.key}">
                                                <option th:each="raca : ${entry.value}" 
                                                        th:value="${raca.id}" 
                                                        th:text="${(raca.nome.contains('Geral') or raca.nome.contains('Não Listada') or raca.nome.contains('SRD') ? '★ ' : '') + raca.nome + ' (Expectativa: ' + raca.expectativaVida + ' anos)'}">
                                                </option>
                                            </optgroup>
                                        </th:block>
                                        <th:block th:if="${racasPorEspecie == null}">
                                            <option th:each="raca : ${racas}" th:value="${raca.id}" th:text="${raca.emoji} + ' ' + ${raca.especie} + ' - ' + raca.nome + ' (Expectativa: ' + ${raca.expectativaVida} + ' anos)'"></option>
                                        </th:block>
                                    </select>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('racaId')}" th:errors="*{racaId}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label for="dataNascimento" class="form-label">Data de Nascimento *</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white" id="btnCalendar" style="cursor: pointer;" title="Abrir calendário">
                                            <i class="bi bi-calendar-event text-teal"></i>
                                        </span>
                                        <input type="text" class="form-control bg-white flatpickr-custom" id="dataNascimento" th:field="*{dataNascimento}" placeholder="DD/MM/AAAA" required>
                                    </div>
                                    <div class="form-text small text-muted">Selecione o dia, mês e ano de nascimento</div>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('dataNascimento')}" th:errors="*{dataNascimento}"></div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                                <a th:href="${petDto != null && petDto.id != null ? '/pets/' + petDto.id : '/pets'}" class="btn btn-outline-secondary px-4">Cancelar</a>
                                <button type="submit" class="btn btn-clyvo px-4">
                                    <i class="bi bi-check-lg me-1"></i>
                                    <span th:text="${petDto != null && petDto.id != null ? 'Salvar Alterações' : 'Salvar Pet'}">Salvar Pet</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Inicialização do Select2 e Flatpickr -->
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    // 1. Select2 para Espécie & Raça
                    if (window.jQuery && jQuery().select2) {
                        var $racaSelect = $('#racaId');
                        $racaSelect.select2({
                            theme: 'bootstrap-5',
                            placeholder: 'Selecione ou digite para buscar espécie/raça...',
                            allowClear: true,
                            width: '100%',
                            language: 'pt-BR'
                        });

                        // Clique no título/categoria para selecionar a opção geral daquela espécie
                        $(document).on('mouseup click', '.select2-results__group', function(e) {
                            e.preventDefault();
                            e.stopPropagation();

                            var $groupLi = $(this).closest('.select2-results__option--group');
                            var $firstOption = $groupLi.find('.select2-results__options--nested .select2-results__option--selectable').first();

                            if ($firstOption.length) {
                                $firstOption.trigger('mouseup');
                            }
                        });

                        // Validação amigável ao submeter o formulário
                        $racaSelect.closest('form').on('submit', function(e) {
                            if (!$racaSelect.val()) {
                                e.preventDefault();
                                $racaSelect.select2('open');
                                return false;
                            }
                            if (!$('#dataNascimento').val()) {
                                e.preventDefault();
                                if (window.petDatePicker) {
                                    window.petDatePicker.open();
                                }
                                return false;
                            }
                        });
                    }

                    // 2. Flatpickr para Seletor de Data Personalizado
                    if (window.flatpickr) {
                        window.petDatePicker = flatpickr('#dataNascimento', {
                            locale: 'pt',
                            altInput: true,
                            altFormat: 'd/m/Y',
                            dateFormat: 'Y-m-d',
                            maxDate: 'today',
                            altInputClass: 'form-control bg-white flatpickr-custom',
                            disableMobile: true,
                            monthSelectorType: 'dropdown'
                        });

                        var btnCal = document.getElementById('btnCalendar');
                        if (btnCal) {
                            btnCal.addEventListener('click', function() {
                                if (window.petDatePicker) {
                                    window.petDatePicker.open();
                                }
                            });
                        }
                    }
                });
            </script>

        </div>
    </div>

</body>
</html>
