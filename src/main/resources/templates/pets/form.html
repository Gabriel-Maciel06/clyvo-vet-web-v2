<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${petDto != null && petDto.id != null ? 'Editar Pet' : 'Cadastrar Pet'})}"></head>
<body>

    <div th:replace="~{fragments/layout :: appShell('pets', ~{::#mainSection})}">
        <div id="mainSection">

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card p-4 p-md-5">
                        <div class="mb-4">
                            <h3 class="mb-1">
                                <i class="bi bi-pencil-square me-2" style="color: #0d9488;" th:if="${petDto != null && petDto.id != null}"></i>
                                <i class="bi bi-heart-pulse me-2" style="color: #0d9488;" th:if="${petDto == null || petDto.id == null}"></i>
                                <span th:text="${petDto != null && petDto.id != null ? 'Editar Informações do Pet' : 'Cadastrar Novo Pet'}">Cadastrar Novo Pet</span>
                            </h3>
                            <p class="text-muted mb-0" th:text="${petDto != null && petDto.id != null ? 'Atualize as informações do animal para manter o prontuário e o cálculo de longevidade em dia.' : 'Insira as informações do animal para acompanhamento preventivo e cálculo de longevidade.'}">
                                Insira as informações do animal para acompanhamento preventivo e cálculo de longevidade.
                            </p>
                        </div>

                        <form th:action="@{/pets/salvar}" th:object="${petDto}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="row g-3">
                                <div class="col-md-8">
                                    <label for="nome" class="form-label">Nome do Pet *</label>
                                    <input type="text" class="form-control" id="nome" th:field="*{nome}" placeholder="Ex: Thor, Luna, Bob" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                                </div>

                                <div class="col-md-4">
                                    <label for="peso" class="form-label">Peso Atual (kg) *</label>
                                    <input type="number" step="0.1" class="form-control" id="peso" th:field="*{peso}" placeholder="Ex: 12.5" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('peso')}" th:errors="*{peso}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label for="racaId" class="form-label">Espécie & Raça *</label>
                                    <select class="form-select" id="racaId" th:field="*{racaId}" required>
                                        <option value="">Selecione a espécie e raça...</option>
                                        <th:block th:if="${racasPorEspecie != null}">
                                            <optgroup th:each="entry : ${racasPorEspecie}" th:label="${entry.value[0].emoji} + ' ' + ${entry.key}">
                                                <option th:each="raca : ${entry.value}" th:value="${raca.id}" th:text="${raca.nome} + ' (Expectativa: ' + ${raca.expectativaVida} + ' anos)'"></option>
                                            </optgroup>
                                        </th:block>
                                        <th:block th:if="${racasPorEspecie == null}">
                                            <option th:each="raca : ${racas}" th:value="${raca.id}" th:text="${raca.emoji} + ' ' + ${raca.especie} + ' - ' + ${raca.nome} + ' (Expectativa: ' + ${raca.expectativaVida} + ' anos)'"></option>
                                        </th:block>
                                    </select>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('racaId')}" th:errors="*{racaId}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label for="dataNascimento" class="form-label">Data de Nascimento *</label>
                                    <input type="date" class="form-control" id="dataNascimento" th:field="*{dataNascimento}" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('dataNascimento')}" th:errors="*{dataNascimento}"></div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                                <a th:href="${petDto != null && petDto.id != null ? '/pets/' + petDto.id : '/pets'}" class="btn btn-outline-secondary px-4">Cancelar</a>
                                <button type="submit" class="btn btn-clyvo px-4">
                                    <i class="bi bi-check-lg me-1"></i>
                                    <span th:text="${petDto != null && petDto.id != null ? 'Salvar Alterações' : 'Salvar Pet'}">Salvar Pet</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
