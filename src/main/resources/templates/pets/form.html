<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastrar Pet')}"></head>
<body>

    <div th:replace="~{fragments/layout :: appShell('pets', ~{::#mainSection})}">
        <div id="mainSection">

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card p-4 p-md-5 border-0 shadow-sm">
                        <div class="d-flex align-items-center gap-3 mb-4">
                            <div class="rounded-circle p-3" style="background-color: #ccfbf1; color: #0d9488;">
                                <i class="bi bi-heart-pulse fs-3"></i>
                            </div>
                            <div>
                                <h3 class="fw-bold mb-0 text-dark">Cadastrar Novo Pet</h3>
                                <p class="text-muted small mb-0">Insira as informações do animal para acompanhamento preventivo e cálculo de longevidade.</p>
                            </div>
                        </div>

                        <form th:action="@{/pets/salvar}" th:object="${petDto}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="row g-3">
                                <div class="col-md-8">
                                    <label for="nome" class="form-label fw-semibold">Nome do Pet *</label>
                                    <input type="text" class="form-control" id="nome" th:field="*{nome}" placeholder="Ex: Thor, Luna, Bob" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                                </div>

                                <div class="col-md-4">
                                    <label for="peso" class="form-label fw-semibold">Peso Atual (kg) *</label>
                                    <input type="number" step="0.1" class="form-control" id="peso" th:field="*{peso}" placeholder="Ex: 12.5" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('peso')}" th:errors="*{peso}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label for="racaId" class="form-label fw-semibold">Raça & Espécie *</label>
                                    <select class="form-select" id="racaId" th:field="*{racaId}" required>
                                        <option value="">Selecione a raça...</option>
                                        <option th:each="raca : ${racas}" th:value="${raca.id}" th:text="${raca.especie} + ' - ' + ${raca.nome} + ' (Expectativa: ' + ${raca.expectativaVida} + ' anos)'"></option>
                                    </select>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('racaId')}" th:errors="*{racaId}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label for="dataNascimento" class="form-label fw-semibold">Data de Nascimento *</label>
                                    <input type="date" class="form-control" id="dataNascimento" th:field="*{dataNascimento}" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('dataNascimento')}" th:errors="*{dataNascimento}"></div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                                <a th:href="@{/pets}" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
                                <button type="submit" class="btn btn-clyvo rounded-pill px-4">
                                    <i class="bi bi-check-lg me-1"></i> Salvar Pet
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
