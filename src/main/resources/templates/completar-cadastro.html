<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Completar cadastro')}"></head>
<body>

    <div th:replace="~{fragments/layout :: appShell('dashboard', ~{::#mainSection})}">
        <div id="mainSection">

            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div class="card p-4 p-md-5">
                        <h1 class="serif-display mb-1" style="font-size: 1.5rem;">Complete sua ficha</h1>
                        <p class="text-muted mb-4" style="font-size: 0.9rem;">
                            Você entrou com o Google. Falta o CPF e o telefone para liberar o cadastro de pets.
                        </p>

                        <div th:if="${errorMessage}" class="selo selo-rust mb-3"><i class="bi bi-exclamation-circle"></i> <span th:text="${errorMessage}"></span></div>

                        <form th:action="@{/perfil/completar-cadastro}" th:object="${completarCadastroDto}" method="post">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">CPF *</label>
                                    <input type="text" class="form-control" th:field="*{cpf}" placeholder="000.000.000-00" required autofocus>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Telefone *</label>
                                    <input type="text" class="form-control" th:field="*{telefone}" placeholder="(11) 98765-4321" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-clyvo mt-4">Concluir cadastro</button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
