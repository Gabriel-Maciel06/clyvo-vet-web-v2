<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Completar Cadastro')}"></head>
<body>

    <div th:replace="~{fragments/layout :: appShell('dashboard', ~{::#mainSection})}">
        <div id="mainSection">

            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div class="card p-4 p-md-5">
                        <div class="mb-4">
                            <h3 class="mb-1"><i class="bi bi-person-check-fill me-2" style="color: #0d9488;"></i>Complete seu cadastro</h3>
                            <p class="text-muted mb-0">Você entrou com o Google. Falta informar CPF e telefone para liberar o cadastro de pets.</p>
                        </div>

                        <div th:if="${errorMessage}" class="alert alert-danger small" role="alert">
                            <i class="bi bi-exclamation-circle-fill me-1"></i> <span th:text="${errorMessage}"></span>
                        </div>

                        <form th:action="@{/perfil/completar-cadastro}" th:object="${completarCadastroDto}" method="post">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">CPF *</label>
                                    <input type="text" class="form-control" th:field="*{cpf}" placeholder="000.000.000-00" required autofocus>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Telefone *</label>
                                    <input type="text" class="form-control" th:field="*{telefone}" placeholder="(11) 98765-4321" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                                <button type="submit" class="btn btn-clyvo px-4">
                                    <i class="bi bi-check-lg me-1"></i> Concluir Cadastro
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
