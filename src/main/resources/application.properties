# ===================================================================
# Clyvo Vet Web - Configurações Gerais da Aplicação
# ===================================================================
# Este arquivo traz os valores de DESENVOLVIMENTO (perfil padrão, sem
# necessidade de configurar nada). Para produção, ative o perfil "prod"
# (SPRING_PROFILES_ACTIVE=prod), que sobrescreve os itens sensíveis em
# application-prod.properties (banco real, sem console H2, sem CSRF
# aberto, sem credenciais de teste na tela de login).
# ===================================================================
spring.application.name=clyvo-vet-web
server.port=${PORT:8095}

# ===================================================================
# Banco de Dados (H2 In-Memory com Modo Oracle) - apenas em desenvolvimento
# ===================================================================
spring.datasource.url=jdbc:h2:mem:clyvodb;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# Flyway Migrations (Controle de Versão de Banco de Dados)
# ===================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===================================================================
# Hibernate / JPA
# O Flyway gerencia o DDL, o Hibernate apenas valida o esquema
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Thymeleaf Configuration
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ===================================================================
# E-mail (recuperação de senha) - OPCIONAL, nada a configurar aqui.
# Se as variáveis de ambiente padrão do Spring Boot (SPRING_MAIL_HOST,
# SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD, SPRING_MAIL_PORT) não
# existirem, o Boot não cria o JavaMailSender e o NotificacaoEmailService
# registra o link de redefinição no log em vez de falhar — por isso NÃO
# declaramos spring.mail.host aqui com um valor padrão vazio, o que
# forçaria a criação do bean mesmo sem servidor configurado.
# ===================================================================

# ===================================================================
# Login com Google (OAuth2) - opcional. Só é ativado quando as variáveis
# de ambiente GOOGLE_CLIENT_ID e GOOGLE_CLIENT_SECRET existem (ver
# config/GoogleOAuth2Config). Pelo mesmo motivo acima, não declaramos
# essas chaves aqui. Sem elas, a aplicação sobe normalmente com login
# local apenas, e o botão "Continuar com Google" fica oculto.
# ===================================================================

# ===================================================================
# Feature flags de ambiente (sobrescritas em application-prod.properties)
# ===================================================================
app.h2-console.permitir=true
app.mostrar-credenciais-teste=true
app.url-base=${APP_URL_BASE:http://localhost:${PORT:8095}}

# ===================================================================
# Gateway de Pagamento (Stripe / Mercado Pago / Simulado)
# ===================================================================
# Provedor ativo: "auto" (detecta chaves presentes), "stripe", "mercadopago" ou "simulado"
clyvo.gateway.provider=${CLYVO_GATEWAY_PROVIDER:auto}
# Stripe (Cartão de Crédito + PIX + Stripe Checkout Hosted)
clyvo.gateway.stripe.secret-key=${CLYVO_STRIPE_SECRET_KEY:${STRIPE_SECRET_KEY:}}
clyvo.gateway.stripe.publishable-key=${CLYVO_STRIPE_PUBLISHABLE_KEY:${STRIPE_PUBLISHABLE_KEY:}}
clyvo.gateway.stripe.webhook-secret=${CLYVO_STRIPE_WEBHOOK_SECRET:${STRIPE_WEBHOOK_SECRET:}}
# Mercado Pago (PIX Dinâmico com QR Code em tela)
clyvo.gateway.access-token=${CLYVO_GATEWAY_ACCESS_TOKEN:}

# ===================================================================
# Logs
# ===================================================================
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO
