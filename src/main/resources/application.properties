# ===================================================================
# Clyvo Vet Web - Configurações Gerais da Aplicação
# ===================================================================
spring.application.name=clyvo-vet-web
server.port=${PORT:8095}

# ===================================================================
# Banco de Dados (H2 In-Memory com Modo Oracle)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:clyvodb;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# Flyway Migrations (Controle de Versão de Banco de Dados)
# ===================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===================================================================
# Hibernate / JPA
# O Flyway gerencia o DDL, o Hibernate apenas valida o esquema
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Thymeleaf Configuration
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ===================================================================
# Logs
# ===================================================================
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO
